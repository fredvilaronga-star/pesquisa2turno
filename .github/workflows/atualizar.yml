name: Atualizar pesquisas

on:
  schedule:
    # 07h45, 14h45 e 20h45 em Brasília (UTC-3)
    - cron: "45 10 * * *"
    - cron: "45 17 * * *"
    - cron: "45 23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: atualizar-pesquisas
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Parar depois da eleição
        id: data
        run: |
          hoje=$(TZ=America/Sao_Paulo date +%Y-%m-%d)
          echo "hoje=$hoje" >> "$GITHUB_OUTPUT"
          if [[ "$hoje" > "2026-10-26" ]]; then echo "fim=1" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.data.outputs.fim != '1'
        with:
          ref: main

      - name: Pesquisar e atualizar os CSVs
        if: steps.data.outputs.fim != '1'
        uses: anthropics/claude-code-action@v1
        with:
          # Cadastre UM dos dois segredos no repositório (Settings > Secrets and variables > Actions).
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --max-turns 140
            --allowedTools WebSearch,WebFetch,Read,Edit,Write,Glob,Grep,Bash(python3:*),Bash(cat:*),Bash(date:*)
          prompt: |
            Você mantém os dados do site "Radar 2º Turno 2026" (repositório ${{ github.repository }}). Hoje é ${{ steps.data.outputs.hoje }} (America/Sao_Paulo).
            Trabalhe só nos arquivos pesquisas.csv, agenda.csv, datafolha.csv e iris.csv, na raiz do repositório. Não altere nenhum outro arquivo. Não faça commit: o próximo passo do workflow faz.
            Não invente números: só registre o que estiver em fonte pública verificável.

            1. Leia pesquisas.csv e agenda.csv.

            2. Pesquise na web por pesquisas NACIONAIS de 2º turno presidencial Lula x Flávio Bolsonaro divulgadas nos últimos 7 dias. Não use a última data do CSV como corte: uma rodada perdida numa execução anterior precisa ser recuperada na seguinte. Faça as três frentes abaixo, sempre.
               a) Agregadores, primeiro. Abra com WebFetch a matéria mais recente do Poder360 que resume as pesquisas do 2º turno (busque "Poder360 como estão Lula e Flávio nas pesquisas") e a mais recente de calendário ("quando saem as próximas pesquisas Lula Flávio", Times Brasil ou similar). Use as duas como lista de conferência: toda rodada citada ali precisa estar no CSV.
               b) Por instituto (WebSearch "<instituto> 2º turno Flávio Lula"): Datafolha, Quaest, AtlasIntel, PoderData, Vox Brasil, Ipespe, DataTrends, Paraná Pesquisas, Nexus, Real Time Big Data, CNT/MDA, Futura, Ipsos-Ipec, Direct Pesquisas, Seta, Gerp, Indexa/Broadcast, Palver, Veritá, Meio/Ideia, Genial/Quaest, Atlas, e qualquer outro instituto que aparecer nos agregadores.
               c) Por veículo (WebSearch "pesquisa 2º turno Flávio Lula <veículo>"): CNN Brasil, g1, O Globo, UOL, Folha de S.Paulo, Estadão, Broadcast, Jovem Pan, Poder360, O Antagonista, Gazeta do Povo, Metrópoles, Exame, CartaCapital, Times Brasil, InfoMoney, Valor.
               d) Pela agenda: para cada linha de agenda.csv com data prevista igual ou anterior a hoje, busque o resultado com WebSearch "<instituto> <registro TSE>" (quando houver registro) e "<instituto> 2º turno Flávio Lula votos válidos". Se a pesquisa já foi divulgada, ela entra em pesquisas.csv nesta execução, nunca fica na agenda.
               Confirme cada pesquisa abrindo ao menos uma reportagem (WebFetch). Obrigatórios: instituto, registro TSE (BR-xxxxx/2026), período de campo e os percentuais. Amostra, margem e modo entram quando divulgados; se faltarem, deixe o campo vazio e registre mesmo assim. Pesquisas estaduais ficam fora. Não duplique uma rodada já presente: a mesma rodada é a do mesmo registro TSE ou, sem registro, a do mesmo instituto e mesmo período de campo. Uma rodada nova de um instituto já presente (registro diferente) entra como linha nova.
               Se a única fonte for o Poder360 com votos válidos recalculados por ele, registre esses números nas colunas de válidos, deixe os totais vazios e use a URL do Poder360 como fonte.

            3. pesquisas.csv é histórico: cada pesquisa nova confirmada é ACRESCENTADA como nova linha no fim; nunca apague nem altere linhas existentes. Cabeçalho: instituto,divulgacao(AAAA-MM-DD),campo("DD a DD/MM"),amostra,margem_erro,modo,registro_tse,flavio_total,lula_total,branco_nulo,indecisos,flavio_validos,lula_validos,fonte(URL). Use exatamente os nomes de instituto já usados no arquivo (ex.: "AtlasIntel/Bloomberg", "PoderData/Aya", "Nexus/BTG"). Campo vazio quando o dado não foi divulgado. Preencha flavio_validos e lula_validos sempre que o instituto ou a reportagem divulgar votos válidos, mesmo quando também houver totais; o site só calcula os válidos quando esses campos estão vazios. Números com ponto decimal. Coloque entre aspas qualquer campo que contenha vírgula.

            4. agenda.csv (instituto,divulgacao_prevista,registro_tse,amostra,situacao): antes de manter ou acrescentar na agenda uma pesquisa com data prevista igual ou anterior a hoje, confirme pela busca do item 2d que o resultado ainda não saiu; se já saiu, registre em pesquisas.csv em vez de mantê-la na agenda. Remova a linha de uma pesquisa que acabou de entrar no histórico e as linhas com data prevista anterior a hoje cujo resultado não saiu; acrescente as pesquisas nacionais previstas que aparecem na matéria de calendário do item 2a e nos registros do TSE, com a data prevista. Registro e amostra ficam vazios quando a matéria não informa; situacao = "Prevista (fonte: <veículo>)".

            5. datafolha.csv (bloco,grupo,rodada,opcao,pct,fonte) guarda o detalhe de cada rodada do Datafolha de 2º turno. rodada = data de divulgação AAAA-MM-DD. Sempre que houver rodada nova do Datafolha (ou números de uma rodada já registrada que ainda faltem), pesquise reportagens com os recortes e ACRESCENTE linhas, sem apagar as existentes:
               - bloco "estimulada", grupo "Total": opções "Flávio Bolsonaro", "Lula", "Branco, nulo ou nenhum", "Não sabe".
               - bloco "rejeicao", grupo "Total": "Flávio Bolsonaro", "Lula" e, se divulgado, "Rejeita os dois", "Não rejeita nenhum".
               - blocos "certeza" ("Totalmente decidido", "Ainda pode mudar"), "avaliacao" ("Positiva", "Negativa"), "expectativa" ("Acha que Flávio vence", "Acha que Lula vence") e "migracao", quando divulgados.
               - recortes por grupo, sempre com as duas opções "Flávio Bolsonaro" e "Lula", em votos totais: bloco "sexo" (grupos "Mulheres", "Homens"), "idade" ("16 a 24 anos", "25 a 34 anos", "35 a 44 anos", "45 a 59 anos", "60 anos ou mais"), "escolaridade" ("Ensino fundamental", "Ensino médio", "Ensino superior"), "renda" ("Até 2 salários mínimos", "2 a 5 salários mínimos", "5 a 10 salários mínimos", "Mais de 10 salários mínimos"), "regiao" ("Sudeste", "Sul", "Nordeste", "Norte/Centro-Oeste"), "religiao" ("Católicos", "Evangélicos", "Sem religião"), "cor" ("Brancos", "Pardos", "Pretos").
               Use exatamente esses nomes de grupo para que as rodadas se comparem. Só registre grupo cujo número esteja escrito na reportagem; se duas fontes divergirem, prefira a que traz o recorte completo. Pct inteiro ou com ponto decimal. fonte = URL da reportagem.

            5b. iris.csv (atualizacao,flavio_prob,lula_prob,flavio_validos,lula_validos,flavio_min,flavio_max,lula_min,lula_max,fonte) guarda o modelo ÍRIS da Voga. Abra com WebFetch https://voga-iris.com/ e leia, para o 2º turno: a data "Atualizado <dia>", a probabilidade de vitória de cada candidato no Pêndulo e a projeção de votos válidos para 25/10 com a faixa provável de cada um. Confira qual número é de qual candidato (em 19/10 era Lula 54% e Flávio 46%; projeção Lula 50,3% de 42,5% a 58,8%, Flávio 49,7% de 41,2% a 57,5%). Se a data de atualização for nova, ACRESCENTE uma linha (atualizacao AAAA-MM-DD, números com ponto decimal, fonte https://voga-iris.com/); se for a mesma da última linha, não altere. Nunca apague linhas.

            6. Se nada novo foi encontrado, não altere nenhum arquivo. No fim, escreva um resumo de três linhas do que mudou, com os links usados.

      - name: Publicar
        if: steps.data.outputs.fim != '1'
        run: |
          python3 - <<'EOF'
          import csv, sys
          for f in ["pesquisas.csv", "agenda.csv", "datafolha.csv", "iris.csv"]:
              rows = list(csv.reader(open(f, encoding="utf-8")))
              n = len(rows[0])
              bad = [i + 1 for i, r in enumerate(rows) if r and len(r) != n]
              if bad:
                  sys.exit(f"{f}: linhas com número de colunas errado: {bad}")
          EOF
          printf '{"atualizado":"%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > meta.json
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add pesquisas.csv agenda.csv datafolha.csv iris.csv meta.json
          git commit -m "Atualização das pesquisas $(TZ=America/Sao_Paulo date '+%d/%m %H:%M')" || exit 0
          git pull --rebase origin main
          git push
