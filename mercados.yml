name: Atualizar mercados

on:
  schedule:
    # a cada hora, no minuto 20 (fora do horário cheio, quando o GitHub atrasa mais)
    - cron: "20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-mercados
  cancel-in-progress: false

jobs:
  mercados:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Parar depois da eleição
        id: data
        run: |
          hoje=$(TZ=America/Sao_Paulo date +%Y-%m-%d)
          if [[ "$hoje" > "2026-10-26" ]]; then echo "fim=1" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.data.outputs.fim != '1'
        with:
          ref: main

      - name: Ler Polymarket e Kalshi
        if: steps.data.outputs.fim != '1'
        run: python3 mercados.py

      - name: Publicar
        if: steps.data.outputs.fim != '1'
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add mercados.csv
          git commit -m "Mercados $(TZ=America/Sao_Paulo date '+%d/%m %H:%M')" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 5; done
          exit 1
